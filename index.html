 const dice=['⚀','⚁','⚂','⚃','⚄','⚅'];
 function diceRattle(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!dieAudioContext)dieAudioContext=new AC();if(dieAudioContext.state==='suspended')dieAudioContext.resume().catch(()=>{});const now=dieAudioContext.currentTime;const oscillator=dieAudioContext.createOscillator(),gain=dieAudioContext.createGain();oscillator.type='triangle';oscillator.frequency.setValueAtTime(240+Math.random()*180,now);oscillator.frequency.exponentialRampToValueAtTime(110,now+.055);gain.gain.setValueAtTime(.065,now);gain.gain.exponentialRampToValueAtTime(.001,now+.07);oscillator.connect(gain);gain.connect(dieAudioContext.destination);oscillator.start(now);oscillator.stop(now+.075)}catch(e){}}
 function roll(){if(!state||state.finished||rolling||state.rolled)return;rolling=true;let i=0;const button=$('cd-dice');diceRattle();rollTimer=setInterval(()=>{if(button)button.textContent=dice[Math.floor(Math.random()*6)];diceRattle();if(++i>=12){clearInterval(rollTimer);rollTimer=null;rolling=false;state.rolled=1+Math.floor(Math.random()*6);render()}},75)}
 function finish(){if(!state||state.finished)return;state.finished=true;state.running=false;clearInterval(clock);clock=null;const a=state.score;const winner=a[0]===a[1]?'🤝 DRAW!':(a[0]>a[1]?'🔵 BLUE TEAM WINS!':'🔴 RED TEAM WINS!');try{const sound=$('premium-win-audio');sound.currentTime=0;sound.volume=1;premiumLoudSfx();sound.play().catch(()=>{})}catch(e){}render()}
 function tick(){if(!state||!state.running)return;state.left=Math.max(0,state.left-1);const t=$('cd-clock');if(t)t.textContent=fmt(state.left);if(state.left===0)finish()}
 function timer(action){if(!state||state.finished)return;if(action==='start'||action==='resume'){if(state.left===0)state.left=state.duration;state.running=true;clearInterval(clock);clock=setInterval(tick,1000)}else if(action==='pause'){state.running=false;clearInterval(clock);clock=null}else if(action==='reset'){state.running=false;clearInterval(clock);clock=null;state.left=state.duration}const t=$('cd-clock');if(t)t.textContent=fmt(state.left)}
 function adjust(delta){if(!state||state.running)return;state.duration=Math.max(10,Math.min(3600,state.duration+delta));state.left=state.duration;persist();const t=$('cd-clock');if(t)t.textContent=fmt(state.left)}
 function shuffle(){if(!state||!confirm('Shuffle the words and start a new Connect the Dots round?'))return;let style=state.style,duration=state.duration;setup();const select=$('cd-duration');if(select)select.value=String(Math.max(1,Math.round(duration/60)));start(style)}
 function reset(){if(!state)return;if(!confirm('Start a new round and clear the current scores?'))return;let style=state.style,duration=state.duration;setup();const select=$('cd-duration');if(select)select.value=String(Math.max(1,Math.round(duration/60)));start(style)}
 function render(){if(!state)return;const s=state;let cells='';for(let r=0;r<6;r++){cells+=`<div class="cd-cell rowlabel ${s.rolled===r+1?'rowmatch':''}" aria-label="Row ${r+1}">${dice[r]}</div>`;for(let c=0;c<6;c++){const i=r*6+c,v=s.claims[i],cls=s.style===1?(v===1?'blue':v===2?'red':''):(v===3?'shared':v===1?'blue':v===2?'red':'');cells+=`<button class="cd-cell ${cls} ${s.rolled===r+1?'rowmatch':''}" onclick="ConnectDots.claim(${r},${c})" ${s.finished?'disabled':''}>${esc(s.words[i])}</button>`}if(s.style===2)cells+=`<button class="cd-cell trophy-cell ${s.trophies[r]===1?'blue':s.trophies[r]===2?'red':''}" onclick="ConnectDots.trophy(${r})" ${s.finished?'disabled':''}>🏆</button>`}
 const team=t=>`<div class="cd-team ${t===1?'blue':'red'} ${s.team===t?'active':''}">${t===1?'🔵 Blue':'🔴 Red'} Team<strong>${s.score[t-1]}</strong>${s.team===t?'● YOUR TURN':''}</div>`;
 const tools=`<div class="cd-side-actions"><button onclick="ConnectDots.timer('start')">▶ Start</button><button onclick="ConnectDots.timer('pause')">⏸ Pause</button><button onclick="ConnectDots.timer('resume')">⏵ Resume</button><button onclick="ConnectDots.timer('reset')">↺ Timer Reset</button><button onclick="ConnectDots.adjust(-10)">−10 sec</button><button onclick="ConnectDots.adjust(10)">+10 sec</button><button onclick="ConnectDots.shuffle()">🔀 Shuffle</button><button onclick="ConnectDots.reset()">🔄 New Round</button><button onclick="ConnectDots.setup()">⚙ Settings</button><button onclick="Premium.open('menu')">🏠 Games</button><button class="cd-wide" onclick="Premium.fullscreen()">⛶ Fullscreen</button><div class="premium-game-music">${premiumTrackSelector()}<button onclick="togglePremiumGameMusic()">🎵 Music</button><label>🔊 <input type="range" min="0" max="1" step="0.05" value="${window.premiumGameVolume??0.35}" oninput="changePremiumGameVolume(this.value)"></label></div></div>`;
 const result=s.finished?`<div class="cd-result" role="dialog" aria-modal="true" aria-label="Game results"><div class="cd-result-card"><h2>${s.score[0]===s.score[1]?'🤝 It’s a Draw!':s.score[0]>s.score[1]?'🏆 Blue Team Wins!':'🏆 Red Team Wins!'}</h2><p>🔵 Blue ${s.score[0]} &nbsp; — &nbsp; 🔴 Red ${s.score[1]}</p><p>⏱ Time’s up! Well done!</p><button onclick="ConnectDots.reset()">🔄 Play Again</button><button onclick="ConnectDots.setup()">⚙ Change Mode</button></div></div>`:'';
 Premium.dotsShell(s.style===1?'🎲 Connect the Dots — Classic':'🏆 Connect the Dots — Trophy Race',`<div class="cd-layout"><div class="cd-board-wrap"><div class="cd-grid ${s.style===2?'trophy':''}">${cells}</div><p class="cd-notice cd-message" id="cd-message">${s.finished?'🏆 Game finished!':s.rolled?'🎲 Row '+s.rolled+' — Read a word, then tap it!':'🎲 Roll the die to choose a row.'}</p></div><aside class="cd-sidebar">${team(1)}${team(2)}<div class="cd-notice">Turns: ${s.turns}</div><button id="cd-dice" class="cd-die" onclick="ConnectDots.roll()" title="Roll a six-sided die">${s.rolled?dice[s.rolled-1]:'🎲'}</button><div class="cd-notice">${s.rolled?'Row '+s.rolled:'Tap to roll'}</div><div id="cd-clock" class="cd-timer">${fmt(s.left)}</div>${tools}</aside></div>${result}`,true)}
 return {setup,start,claim,trophy,roll,timer,adjust,shuffle,reset,leave};
})();
</script>

<script>
/* v13: click.mp3 only for Tic-Tac-Toe and Phonics Race gameplay. */
(function(){
  const clickSound = new Audio('click.mp3');
  clickSound.preload = 'auto';
  clickSound.volume = 1;
  document.addEventListener('click', function(event){
    const overlay = document.getElementById('premium-overlay');
    if (!overlay || !overlay.classList.contains('play-screen')) return;
    // Gameplay only: tic-tac-toe word tiles and Blue/Red team buttons
    // (including their Move Up action in Phonics Race).
    // Excludes menus, settings, randomizer, presentation, flip cards and navigation.
    const control = event.target.closest('.premium-cell, .premium-team');
    if (!control || control.disabled || !overlay.contains(control)) return;
    // Do not play on an invalid Tic-Tac-Toe tile before a team is selected.
    if (control.classList.contains('premium-cell') &&
        !document.querySelector('.premium-team.active')) return;
    try {
      clickSound.pause();
      clickSound.currentTime = 0;
      premiumLoudSfx();
      clickSound.play().catch(function(){});
    } catch (_) {}
  }, true);
})();
</script>

<script>
/* v14: Fit each game word to its own tile without wrapping or clipping. */
(function(){
  const audio=document.getElementById('bg-audio');
  if(audio){audio.volume=0.35;audio.preload='none';}
  const originalChangeVolume=window.changeVolume;
  window.changeVolume=function(v){
    if(typeof originalChangeVolume==='function')originalChangeVolume(v);
    const old=document.getElementById('music-volume');
    const game=document.getElementById('premium-game-volume');
    if(old)old.value=v;
    if(game)game.value=v;
  };
  let pending=false;
  const measure=document.createElement('canvas').getContext('2d');
  function fitGameWords(){
    pending=false;
    const root=document.getElementById('premium-overlay');
    if(!root||!root.classList.contains('play-screen'))return;
    root.querySelectorAll('.premium-cell,.premium-step').forEach(el=>{
      const text=Array.from(el.childNodes).filter(n=>n.nodeType===3).map(n=>n.textContent).join('').trim();
      if(!text)return;
      const cell=getComputedStyle(el);
      const maxSize=el.classList.contains('premium-cell')?60:48;
      const base=Math.min(maxSize,Math.max(16,el.classList.contains('premium-cell')?Math.min(el.clientWidth*.22,el.clientHeight*.55):Math.min(el.clientWidth*.18,el.clientHeight*.72)));
      const available=Math.max(20,el.clientWidth-14);
      const family="'Comic Neue', cursive";
      let size=base;
      measure.font=`700 ${size}px ${family}`;
      const textWidth=measure.measureText(text).width;
      if(textWidth>available)size=Math.max(9,Math.floor(size*available/textWidth));
      el.style.setProperty('font-size',Math.floor(size)+'px','important');
    });
  }
  function queue(){if(pending)return;pending=true;requestAnimationFrame(fitGameWords)}
  const target=document.getElementById('premium-content');
  if(target)new MutationObserver(queue).observe(target,{childList:true,subtree:true});
  window.addEventListener('resize',queue);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(queue);
  queue();
})();
</script>

<script id="premium-auth-logic">
(()=>{
// ==========================================
    // 1. YOUR SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL =
      "https://onigbrcsfcbuporhylxv.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_MMXsHQKzKYn0mAA3MQOlWA_pEdCS-r3";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    // ==========================================
    // 2. GAME SETTINGS
    // Change this title for each new game.
    // ==========================================

    const GAME_TITLE = "Teacher Khen’s Phonics Board Premium";

    document.title = GAME_TITLE;
    document.getElementById("gameTitle").textContent = GAME_TITLE;


    // ==========================================
    // 3. PAGE ELEMENTS AND STATE
    // ==========================================

    const authScreen = document.getElementById("authScreen");
    const gameArea = document.documentElement;
    const message = document.getElementById("message");
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");

    let currentUserId = null;
    let checkNumber = 0;
    let membershipVerified = false;
    let authInitialized = false;


    function showMessage(text) {
      message.textContent = text;
    }

    function showLogin(text) {
      membershipVerified = false;
      gameArea.classList.remove("premium-authorized");
      authScreen.style.display = "flex";
      showMessage(text);
    }

    function showGame(user, membership) {
      membershipVerified = true;
      currentUserId = user.id;

      authScreen.style.display = "none";
      gameArea.classList.add("premium-authorized");

      document.getElementById("memberInfo").textContent =
        "Premium Member: " + (user.email || "Logged in");

      console.log(
        "Membership verified:",
        membership.plan,
        membership.expires_at
      );
    }


    // ==========================================
    // 4. MEMBERSHIP VERIFICATION
    // ==========================================

    async function verifyMembership(user) {
      const thisCheck = ++checkNumber;

      membershipVerified = false;
      gameArea.classList.remove("premium-authorized");
      authScreen.style.display = "flex";

      if (!user) {
        currentUserId = null;
        showLogin("Please log in to access this Premium game.");
        return;
      }

      currentUserId = user.id;
      showMessage("Checking your Premium membership...");

      try {
        const { data, error } = await db
          .from("learning_hub_memberships")
          .select("user_id, plan, status, expires_at")
          .eq("user_id", user.id)
          .maybeSingle();

        if (thisCheck !== checkNumber) return;

        if (error) {
          console.error("Membership verification failed:", error);
          showLogin(
            "We couldn't verify your membership. Please try again " +
            "or contact support."
          );
          return;
        }

        if (!data) {
          showLogin(
            "No membership was found for this account. " +
            "Please subscribe or contact support."
          );
          return;
        }

        const allowedPlans = ["monthly", "yearly", "premium"];

        const plan = String(data.plan || "").toLowerCase();
        const status = String(data.status || "").toLowerCase();

        const expiration = data.expires_at
          ? Date.parse(data.expires_at)
          : NaN;

        const planIsValid = allowedPlans.includes(plan);
        const statusIsValid = status === "active";
        const expirationIsValid =
          Number.isFinite(expiration) && expiration > Date.now();

        if (
          data.user_id !== user.id ||
          !planIsValid ||
          !statusIsValid ||
          !expirationIsValid
        ) {
          showLogin(
            "Your Premium membership is inactive or expired. " +
            "Please renew your subscription."
          );
          return;
        }

        showGame(user, data);

      } catch (error) {
        console.error(error);

        if (thisCheck === checkNumber) {
          showLogin(
            "Unable to verify membership. Check your connection " +
            "and try again."
          );
        }
      }
    }


    // ==========================================
    // 5. LOGIN
    // ==========================================

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      loginButton.disabled = true;
      showMessage("Logging in...");

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } = await db.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          showMessage("Login failed: " + error.message);
          return;
        }

        await verifyMembership(data.user);

      } catch (error) {
        console.error(error);
        showMessage("Login failed. Please try again.");
      } finally {
        loginButton.disabled = false;
      }
    });


    // ==========================================
    // 6. REGISTER
    // ==========================================

    document.getElementById("signupButton")
      .addEventListener("click", async function() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
          showMessage("Enter your email and password first.");
          return;
        }

        if (password.length < 6) {
          showMessage("Your password must be at least 6 characters.");
          return;
        }

        showMessage("Creating your account...");

        try {
          const { data, error } = await db.auth.signUp({
            email,
            password
          });

          if (error) {
            showMessage("Registration failed: " + error.message);
            return;
          }

          if (data.session && data.user) {
            await verifyMembership(data.user);
          } else {
            showMessage(
              "Account request submitted. Check your email to confirm " +
              "your account if required, then log in. An account alone " +
              "does not grant Premium access."
            );
          }

        } catch (error) {
          console.error(error);
          showMessage("Registration failed. Please try again.");
        }
      });


    // ==========================================
    // 7. PASSWORD RECOVERY
    // ==========================================

    document.getElementById("resetButton")
      .addEventListener("click", async function() {
        const email = document.getElementById("email").value.trim();

        if (!email) {
          showMessage("Enter your email address first.");
          return;
        }

        showMessage("Requesting password recovery...");

        try {
          const { error } = await db.auth.resetPasswordForEmail(email);

          if (error) {
            showMessage("Password reset failed: " + error.message);
          } else {
            showMessage(
              "If the account can receive recovery emails, " +
              "instructions will be sent to the email address."
            );
          }
        } catch (error) {
          console.error(error);
          showMessage("Unable to request password recovery.");
        }
      });


    // ==========================================
    // 8. LOGOUT
    // ==========================================

    document.getElementById("logoutButton")
      .addEventListener("click", async function() {
        showLogin("Logging out...");

        // Immediately invalidate any in-progress membership check.
        checkNumber++;
        currentUserId = null;
        membershipVerified = false;

        const { error } = await db.auth.signOut();

        if (error) {
          console.error(error);
          showMessage(
            "Logout could not be confirmed. Please refresh and try again."
          );
        } else {
          showLogin("You have logged out.");
        }
      });


    // ==========================================
    // 9. SESSION RESTORATION AND CHANGES
    // ==========================================

    db.auth.onAuthStateChange((event, session) => {
      if (event === "TOKEN_REFRESHED") return;

      const user = session?.user || null;

      if (!user) {
        checkNumber++;
        currentUserId = null;
        membershipVerified = false;

        if (authInitialized) {
          showLogin("Please log in to access this Premium game.");
        }
        return;
      }

      // Skip a duplicate event if the same user has already
      // passed the membership check.
      if (
        membershipVerified &&
        currentUserId === user.id &&
        gameArea.classList.contains("premium-authorized")
      ) {
        return;
      }

      // Avoid performing database queries inside the auth callback.
      setTimeout(() => {
        verifyMembership(user);
      }, 0);
    });


    // ==========================================
    // 10. INITIALIZE
    // ==========================================

    (async function initialize() {
      showMessage("Checking your login...");

      try {
        const { data, error } = await db.auth.getSession();

        if (error) {
          showLogin("Unable to check your session. Please refresh.");
          return;
        }

        authInitialized = true;

        if (data.session?.user) {
          await verifyMembership(data.session.user);
        } else {
          showLogin("Please log in to access this Premium game.");
        }

      } catch (error) {
        console.error(error);
        authInitialized = true;
        showLogin("Unable to connect. Please refresh and try again.");
      }
    })();

  
})();
</script>

 function spawn(team){const lane=$('bp-lane-'+team);if(!lane||!active)return;const existing=lane.querySelectorAll('.bp-balloon').length;if(existing>=6)return;const pool=pres.words.filter(w=>w.text?.trim());if(!pool.length)return;let index=Math.floor(Math.random()*pool.length);if(pool.length>1&&index===last[team])index=(index+1)%pool.length;last[team]=index;const word=pool[index],picture=mode==='pictures'||(mode==='mix'&&Math.random()<.5);const colors=['#ff91ad','#ffd65a','#9fdf8b','#9bd8ff','#c9a3ff','#ffa86f','#75e4d0'];const b=document.createElement('button');b.type='button';b.className='bp-balloon';/* Keep new balloons/bubbles comfortably separated, including on narrow two-player lanes. */

<script>
/* Multi-touch input adapter for classroom boards and tablets.
   Each distinct target receives its own pointerdown; native mouse clicks remain intact.
   The existing game rules still decide whether a move is legal. */
(function(){
 const targetSelector='.premium-cell,.premium-team,.cd-cell:not(.rowlabel),.cd-die';
 document.addEventListener('pointerdown',function(e){
   if(e.pointerType==='mouse' && e.button!==0)return;
   if(e.pointerType!=='touch' && e.pointerType!=='pen')return;
   const target=e.target.closest?.(targetSelector);
   if(!target || target.disabled || !target.isConnected)return;
   e.preventDefault();
   e.stopPropagation();
   // Call the original inline handler immediately, before another finger changes the DOM.
   if(typeof target.onclick==='function')target.onclick.call(target,e);
 },{capture:true,passive:false});
 // Prevent a touch-generated click from invoking the same action twice.
 let touchBlockUntil=0;
 document.addEventListener('pointerdown',function(e){if(e.pointerType==='touch'||e.pointerType==='pen')touchBlockUntil=performance.now()+850},{capture:true});
 document.addEventListener('click',function(e){
   if(e.detail===0)return; // keyboard activation remains accessible
   if(performance.now()>touchBlockUntil)return;
   if(e.sourceCapabilities?.firesTouchEvents || e.pointerType==='touch' || e.pointerType==='pen'){
     if(e.target.closest?.(targetSelector)){e.preventDefault();e.stopImmediatePropagation()}
   }
 },true);
})();
</script>

<!-- TeacherKhen Community Connector — Phonics Board Premium -->
<script>
(() => {
  'use strict';
  if (location.hash !== '#tk-community' || !window.opener) return;
  const origins = new Set(['https://teacherkhen.com','https://www.teacherkhen.com']);
  const msg = {
    ready:'TK_PHONICSPREMIUM_READY',
    lesson:'TK_PHONICSPREMIUM_LESSON',
    loaded:'TK_PHONICSPREMIUM_LOADED',
    error:'TK_PHONICSPREMIUM_ERROR'
  };
  let finished = false;
  let pending = null;
  let pendingOrigin = null;
  let attempts = 0;
  let readyTimer = null;
  let authTimer = null;
  const authorized = () => document.documentElement.classList.contains('premium-authorized');
  function send(type, extra = {}, origin = null) {
    if (!window.opener || window.opener.closed) return;
    const payload = {type, ...extra};
    if (origin) window.opener.postMessage(payload, origin);
    else origins.forEach(o => window.opener.postMessage(payload, o));
  }
  function tryLoad() {
    if (finished || !pending || !authorized()) return;
    const lesson = pending;
    pending = null;
    try {
      if (typeof window.TKPhonicsPremiumCommunityLoad !== 'function')
        throw new Error('Phonics Board Premium adapter was not initialized.');
      window.TKPhonicsPremiumCommunityLoad(lesson);
      finished = true;
      clearInterval(readyTimer);
      clearInterval(authTimer);
      send(msg.loaded, {}, pendingOrigin);
    } catch (e) {
      send(msg.error, {message: e?.message || 'Unable to load Premium lesson.'}, pendingOrigin);
    }
  }
  window.addEventListener('message', event => {
    if (event.source !== window.opener || !origins.has(event.origin) || finished ||
        event.data?.type !== msg.lesson) return;
    if (!event.data.lesson || typeof event.data.lesson !== 'object' ||
        Array.isArray(event.data.lesson) || !Array.isArray(event.data.lesson.presets)) {
      send(msg.error, {message:'Invalid Premium lesson JSON.'}, event.origin);
      return;
    }
    pending = event.data.lesson;
    pendingOrigin = event.origin;
    tryLoad();
  });
  function announce() {
    if (finished || pending || !window.opener || window.opener.closed || attempts++ >= 90) {
      clearInterval(readyTimer);
      return;
    }
    send(msg.ready);
  }
  function start() {
    announce();
    readyTimer = setInterval(announce, 1000);
    authTimer = setInterval(tryLoad, 500);
  }
  if (document.readyState === 'complete') start();
  else window.addEventListener('load', start, {once:true});
})();
</script>
