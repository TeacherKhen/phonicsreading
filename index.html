<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher Khen's Phonics Board</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Comic+Neue:wght@400;700&family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --chalkboard: #1b3022;
            --wood: #4e342e;
            --card-front: #ff9800;
            --team1-color: #42a5f5;
            --team2-color: #ef5350;
        }

        body {
            margin: 0;
            background: var(--chalkboard);
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 25px 25px;
            font-family: 'Comic Sans MS', cursive;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: white;
            overflow: hidden;
            touch-action: manipulation;
        }

        .settings-bar {
            width: 100%;
            background: rgba(0,0,0,0.7);
            padding: 8px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            z-index: 100;
        }

        input {
            padding: 6px;
            border-radius: 5px;
            border: none;
            width: 200px;
            font-size: 14px;
        }

        .btn-small {
            padding: 6px 10px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            background: #ffca28;
            font-size: 12px;
        }

        .btn-toggle-cards {
            background: #00bcd4 !important;
            color: white;
        }

        .btn-reset {
            background: #f44336 !important;
            color: white;
        }

        select {
            padding: 6px;
            border-radius: 5px;
            background: white;
            cursor: pointer;
        }

        #main-container {
            display: flex;
            flex-grow: 1;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        /* Drawing Canvas Layer */
        #drawing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            pointer-events: none;
            touch-action: none;
        }

        #drawing-canvas.active {
            pointer-events: auto;
            cursor: crosshair;
        }

        /* Pen Controls Popup Bar */
        .pen-tools {
            position: fixed;
            bottom: 25px;
            right: 95px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid white;
            border-radius: 30px;
            padding: 6px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1500;
        }

        .pen-size-btn {
            background: #555;
            color: white;
            border: 1px solid white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .pen-size-btn.active {
            background: #ffca28;
            color: black;
        }

        .game-section {
            display: flex;
            flex-direction: column;
            flex: 1;
            position: relative;
            border-right: 2px dashed rgba(255,255,255,0.2);
            min-width: 0;
        }

        .team-label {
            text-align: center;
            padding: 5px;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
        }

        .scoreboard {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.1);
            margin: 5px auto;
            padding: 5px 15px;
            border-radius: 20px;
            width: fit-content;
        }

        .score-num {
            font-size: 24px;
            color: #ffeb3b;
            min-width: 30px;
            text-align: center;
        }

        .score-btn {
            background: none;
            border: 1px solid white;
            color: white;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
        }

        .board-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
            gap: 1%;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            transition: opacity 0.2s ease;
        }

        /* Visibility modifier class for hidden cards */
        .cards-hidden .card,
        .cards-hidden .final-word {
            visibility: hidden !important;
            opacity: 0 !important;
        }

        /* Card Sizing */
        .card {
            perspective: 1000px;
            width: 110px;
            max-width: 18%;
            height: 180px;
            cursor: pointer;
            flex-shrink: 1;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .card-front {
            background: var(--card-front);
            font-size: 2.5rem;
        }

        .card-back {
            background: white;
            color: #333;
            transform: rotateY(180deg);
            font-size: 5rem;
        }

        .final-word {
            font-size: 5rem;
            text-shadow: 3px 3px 0px #000;
            text-align: center;
            white-space: nowrap;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        /* Single Mode Overrides */
        body.single-mode .card {
            width: 160px;
            height: 250px;
            flex-shrink: 0;
            max-width: none;
        }

        body.single-mode .card-front {
            font-size: 70px;
        }

        body.single-mode .card-back {
            font-size: 120px;
        }

        body.single-mode .final-word {
            font-size: 160px;
        }

        body.single-mode .game-section {
            border: none;
        }

        body.single-mode .board-area {
            overflow-x: auto;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.4s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            border: 4px solid white;
            box-shadow: 0 8px 15px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }

        .controls {
            background: var(--wood);
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 10;
        }

        .main-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #222;
        }

        .main-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .btn-nav {
            background: #4caf50;
            color: white;
        }

        .btn-check {
            background: #ffeb3b;
            color: #333;
        }

        .hidden {
            display: none !important;
        }

        .star {
            position: absolute;
            background: #ffeb3b;
            width: 12px;
            height: 12px;
            clip-path: polygon(
                50% 0%,
                61% 35%,
                98% 35%,
                68% 57%,
                79% 91%,
                50% 70%,
                21% 91%,
                32% 57%,
                2% 35%,
                39% 35%
            );
            pointer-events: none;
            animation: burst 1.2s ease-out forwards;
        }

        @keyframes burst {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* Floating Action Buttons */
        .floating-btn-container {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1500;
        }

        .floating-action-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            color: white;
            border: 3px solid white;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            font-size: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .floating-action-btn:hover {
            transform: scale(1.1);
        }

        #btn-music {
            background: #ff5722;
        }

        #btn-pen {
            background: #e91e63;
        }

        #btn-pen.active {
            background: #4caf50;
            border-color: #ffeb3b;
        }

        #btn-photo-drawer {
            background: #ab47bc;
        }

        #btn-letter-drawer {
            background: #26a69a;
        }

        /* Music Controls Toolbar */
        .music-tools {
            position: fixed;
            bottom: 220px;
            right: 95px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid white;
            border-radius: 20px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1500;
        }

        .music-btn {
            background: #ffca28;
            color: black;
            border: none;
            border-radius: 5px;
            padding: 6px 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        .music-slider {
            width: 80px;
            cursor: pointer;
        }

        /* Slide Drawers */
        .side-drawer {
            position: fixed;
            right: -320px;
            top: 0;
            width: 300px;
            height: 100%;
            background: rgba(30, 30, 30, 0.95);
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            z-index: 1600;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }

        .side-drawer.open {
            right: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #555;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .drawer-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        #gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            overflow-y: auto;
            flex-grow: 1;
            padding: 5px;
        }

        .gallery-thumb-container {
            position: relative;
            display: inline-block;
        }

        .gallery-thumb {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #fff;
            cursor: pointer;
            transition: transform 0.2s;
            box-sizing: border-box;
        }

        .gallery-thumb:hover {
            transform: scale(1.05);
        }

        .thumb-delete-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(244, 67, 54, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Small label for preset pictures */
        .preset-label {
            position: absolute;
            left: 4px;
            bottom: 4px;
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
        }

        /* Alphabet Grid */
        #letter-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            overflow-y: auto;
            flex-grow: 1;
            padding: 5px;
        }

        .letter-tile {
            background: #ff9800;
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 50px;
            cursor: pointer;
            user-select: none;
        }

        .letter-tile:hover {
            background: #ffa726;
        }

        /* Draggable Overlay Items - NO BORDERS */
        .draggable-wrapper {
            position: absolute;
            z-index: 500;
            cursor: move;
            display: inline-block;
            user-select: none;
            touch-action: none;
            width: 160px;
            height: 160px;
            min-width: 60px;
            min-height: 60px;
        }

        .draggable-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border: none;
            border-radius: 0;
            box-shadow: none;
            pointer-events: none;
            box-sizing: border-box;
            background: transparent;
        }

        .draggable-letter {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 0;
            background: transparent;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            font-weight: bold;
            box-shadow: none;
            box-sizing: border-box;
            pointer-events: none;
            line-height: 1;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.6);
        }

        .overlay-delete-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #f44336;
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            pointer-events: auto;
            z-index: 10;
        }

        .overlay-resize-handle {
            position: absolute;
            bottom: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            background: #ffca28;
            border: 2px solid white;
            border-radius: 50%;
            cursor: nwse-resize;
            touch-action: none;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Comic+Neue:wght@400;700&family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap');
.card-back,.final-word,.letter-tile,.draggable-letter,.premium-cell,.premium-step,.premium-display{font-family:'Comic Neue',sans-serif!important}
.premium-ui{font-family:Nunito,sans-serif}.premium-ui h2,.premium-ui h3{font-family:Fredoka,sans-serif}
.premium-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;background:#294b36;padding:7px;z-index:110;position:relative}
.premium-top button,.premium-ui button{cursor:pointer;border:0;border-radius:9px;padding:9px 12px;font-weight:800;background:#ffd166;color:#203329}
.premium-ui button:disabled{opacity:.45;cursor:not-allowed}
.premium-ui input,.premium-ui select,.premium-ui textarea{font:inherit;max-width:100%;box-sizing:border-box;padding:8px;border:1px solid #aab;border-radius:7px;background:#fff;color:#17291d}
.premium-ui input[type=checkbox]{width:auto}.premium-ui label{display:inline-flex;gap:5px;align-items:center;flex-wrap:wrap}
.premium-overlay{position:fixed;inset:0;background:#08160fe8;z-index:3000;display:none;overflow:auto;padding:15px;box-sizing:border-box}
.premium-overlay.open{display:block}.premium-panel{background:#f9f6e8;color:#22372b;max-width:1040px;margin:auto;border:8px solid #76513b;border-radius:18px;padding:16px;box-sizing:border-box}
.premium-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:10px 0}.premium-row>*{max-width:100%}
.premium-panel h2{margin:0 0 8px}.premium-panel h3{margin:15px 0 7px}.premium-panel textarea{width:100%;min-height:95px}
.premium-board{display:grid;gap:7px;margin:15px auto;width:min(92vw,700px);aspect-ratio:1}
.premium-cell{position:relative;background:#fff8df;border:3px solid #a67a42!important;border-radius:12px;min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow-wrap:anywhere;word-break:break-word;font-size:clamp(13px,2.8vw,28px);padding:3px!important;color:#263e30!important}
.premium-cell.blue{background:#287be3;color:white!important;box-shadow:0 0 14px #52c8ff}.premium-cell.red{background:#e94352;color:white!important;box-shadow:0 0 14px #ff7d7d}
.premium-cell.win{outline:5px solid #ffdc50;animation:pulsewin 1s infinite alternate}@keyframes pulsewin{to{filter:brightness(1.35)}}
.premium-team{font-size:17px;padding:12px 20px!important}.premium-team.blue{background:#3189ff;color:#fff}.premium-team.red{background:#e94758;color:#fff}.premium-team.active{outline:4px solid #ffd166;box-shadow:0 0 20px #ffdf64}
.premium-ladders{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:end;max-width:840px;margin:auto}
.premium-ladder{display:flex;flex-direction:column-reverse;align-items:center;gap:5px;min-width:0}
.premium-step{background:#fff5cf;border:3px solid #ba9d69;border-radius:9px;min-height:42px;width:var(--step-width);max-width:100%;display:flex;align-items:center;justify-content:center;color:#173d28;font-size:clamp(13px,2.4vw,23px);font-weight:bold;text-align:center;padding:4px;box-sizing:border-box;overflow-wrap:anywhere}
.premium-step.done.blue{background:#3387ed;color:white}.premium-step.done.red{background:#eb5260;color:white}
.premium-trophy{text-align:center;font-size:50px}.premium-display{text-align:center;font-size:clamp(40px,9vw,110px);font-weight:bold;overflow-wrap:anywhere}
.premium-photo{max-width:100%;max-height:55vh;object-fit:contain}.premium-photo-box{resize:both;overflow:auto;width:min(450px,90%);height:310px;min-width:160px;min-height:120px;margin:12px auto;background:#fff;border:3px solid #ad8a54;border-radius:12px;text-align:center}
.premium-photo-box img{width:100%;height:100%;object-fit:contain}
.premium-wordrow{display:grid;grid-template-columns:minmax(95px,1fr) minmax(100px,2fr) auto;gap:7px;align-items:center;margin:6px 0}
.premium-wordrow input{width:100%}.premium-wordrow img{height:78px;max-width:115px;object-fit:contain}.premium-wordrow .premium-photo-missing{font-size:11px;color:#775e48}.premium-photo-box .premium-photo-missing{display:block;padding:22px;font:700 18px Nunito,sans-serif;color:#775e48}
.premium-notice{background:#e3f2e5;padding:10px;border-radius:8px}.premium-winner{font-size:clamp(28px,6vw,60px);text-align:center;color:#d7a51b;font-family:Fredoka,sans-serif;animation:pulsewin .5s infinite alternate}
.premium-hidden{display:none!important}#premium-toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:5000;background:#193b27;color:white;padding:12px;border-radius:12px;display:none}
@media(max-width:600px){.premium-panel{padding:9px;border-width:4px}.premium-board{gap:3px}.premium-cell{border-width:1px!important}.premium-top button{padding:6px}.premium-ladders{gap:6px}.premium-step{min-height:34px}}


/* Premium v3: full-viewport classroom gameplay */
body,.card-back,.final-word,.letter-tile,.draggable-letter,.premium-cell,.premium-step,.premium-display{font-family:'Comic Neue',sans-serif!important}
.premium-overlay.play-screen,.premium-overlay.presentation-screen{padding:0;overflow:hidden;background:#163825}
.premium-overlay.play-screen .premium-panel,.premium-overlay.presentation-screen .premium-panel{width:100vw;max-width:none;height:100dvh;max-height:100dvh;margin:0;border:0;border-radius:0;padding:clamp(5px,1vh,12px);display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(135deg,#f6f0d9,#e6f4e4)}
.premium-overlay.play-screen #premium-content,.premium-overlay.presentation-screen #premium-content{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.premium-overlay.play-screen .premium-row,.premium-overlay.presentation-screen .premium-row{margin:4px 0}
.premium-play-layout{display:grid;grid-template-columns:clamp(85px,12vw,190px) minmax(0,1fr) clamp(85px,12vw,190px);gap:clamp(3px,1vw,14px);flex:1;min-height:0;align-items:stretch}
.premium-play-main{display:flex;flex-direction:column;min-width:0;min-height:0;align-items:stretch;justify-content:center}
.premium-side{display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:8px}
.premium-side .premium-team{min-height:clamp(90px,26vh,240px);font-size:clamp(14px,2vw,27px);white-space:normal;padding:8px!important;box-shadow:0 6px 16px #0003}
.premium-overlay.play-screen .premium-board{width:auto;max-width:100%;height:100%;max-height:100%;aspect-ratio:auto;flex:1;min-height:0;margin:0;gap:clamp(2px,.6vw,9px)}
.premium-overlay.play-screen .premium-cell{font-size:clamp(12px,min(2.6vw,4.2vh),36px);line-height:1.1;border-radius:clamp(4px,1vw,14px);padding:2px!important}
.premium-overlay.play-screen .premium-cell span{font-size:clamp(12px,2vh,23px)}
.premium-overlay.play-screen .premium-ladders{max-width:none;width:100%;flex:1;min-height:0;gap:clamp(5px,2vw,30px);align-items:stretch}
.premium-overlay.play-screen .premium-ladders>div{min-height:0;display:flex;flex-direction:column;align-items:center}
.premium-overlay.play-screen .premium-ladder{flex:1;width:100%;min-height:0;gap:2px}
.premium-overlay.play-screen .premium-step{flex:1;min-height:0;width:var(--step-width);font-size:clamp(13px,min(2.7vw,3.6vh),35px);padding:1px}
.premium-overlay.play-screen .premium-trophy{font-size:clamp(28px,6vh,70px);line-height:1}
.premium-overlay.play-screen .premium-winner{font-size:clamp(18px,4vh,42px);line-height:1.1}
.premium-overlay.presentation-screen .premium-display{font-size:clamp(34px,min(8vh,9vw),112px);line-height:1.16;max-width:96vw;margin:4px auto;overflow-wrap:anywhere}

<script>

    /* =========================================================
       GAME DATA
       ========================================================= */

    let wordList = [];

    let state = {
        t1: {
            index: 0,
            score: 0
        },
        t2: {
            index: 0,
            score: 0
        }
    };

    /*
     * USER-UPLOADED PICTURES
     */
    let photoStore = [];

    /*
     * BUILT-IN PRESET PICTURES
     *
     * Add more filenames here in the future if needed.
     *
     * Example:
     * const presetPhotos = [
     *     "slide.png",
     *     "apple.webp",
     *     "cat.webp"
     * ];
     */
    const presetPhotos = [
        "slide.png"
    ];

    let activeBoardOverlays = [];

    let currentLetterCase = 'upper';

    let cardsAreHidden = false;

    const audioCtx = new (
        window.AudioContext ||
        window.webkitAudioContext
    )();


    /* =========================================================
       MUSIC PLAYER CONTROLS
       ========================================================= */

    const bgAudio = document.getElementById('bg-audio');

    function toggleMusicTools() {

        const musicTools =
            document.getElementById('music-tools');

        musicTools.classList.toggle('hidden');

    }

    function togglePlayMusic() {

        const playBtn =
            document.getElementById('btn-play-music');

        if (bgAudio.paused) {

            bgAudio.play().then(() => {

                playBtn.innerText = "⏸️ Pause";

            }).catch(e => {

                alert(
                    "Please make sure 'music.mp3' is in the same folder or upload a music file with 📁 button."
                );

            });

        } else {

            bgAudio.pause();

            playBtn.innerText = "▶️ Play";

        }

    }

    function stopMusic() {

        bgAudio.pause();

        bgAudio.currentTime = 0;

        document.getElementById(
            'btn-play-music'
        ).innerText = "▶️ Play";

    }

    function changeVolume(val) {

        bgAudio.volume = val;

    }

    function loadMusicFile(e) {

        const file = e.target.files[0];

        if (file) {

            bgAudio.src = URL.createObjectURL(file);

            stopMusic();

            togglePlayMusic();

        }

    }


    /* =========================================================
       CANVAS PEN LOGIC
       ========================================================= */

    let isDrawingMode = false;

    let isDrawing = false;

    let currentPenSize = 3;

    let canvas, ctx;


    function initCanvas() {

        canvas =
            document.getElementById('drawing-canvas');

        ctx =
            canvas.getContext('2d');

        resizeCanvas();

        window.addEventListener(
            'resize',
            resizeCanvas
        );

        canvas.addEventListener(
            'pointerdown',
            startDrawing
        );

        canvas.addEventListener(
            'pointermove',
            draw
        );

        canvas.addEventListener(
            'pointerup',
            stopDrawing
        );

        canvas.addEventListener(
            'pointercancel',
            stopDrawing
        );

    }


    function resizeCanvas() {

        if (!canvas) return;

        const tempImage =
            ctx
                ? ctx.getImageData(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                )
                : null;

        const container =
            document.getElementById(
                'main-container'
            );

        canvas.width =
            container.clientWidth;

        canvas.height =
            container.clientHeight;

        if (tempImage) {

            ctx.putImageData(
                tempImage,
                0,
                0
            );

        }

    }


    function togglePen() {

        isDrawingMode = !isDrawingMode;

        const btn =
            document.getElementById('btn-pen');

        const penTools =
            document.getElementById('pen-tools');

        canvas.classList.toggle(
            'active',
            isDrawingMode
        );

        btn.classList.toggle(
            'active',
            isDrawingMode
        );

        penTools.classList.toggle(
            'hidden',
            !isDrawingMode
        );

    }


    function setPenSize(size, el) {

        currentPenSize = size;

        document
            .querySelectorAll('.pen-size-btn')
            .forEach(b =>
                b.classList.remove('active')
            );

        el.classList.add('active');

    }


    function clearCanvas() {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }


    function startDrawing(e) {

        if (!isDrawingMode) return;

        isDrawing = true;

        const rect =
            canvas.getBoundingClientRect();

        ctx.beginPath();

        ctx.moveTo(
            e.clientX - rect.left,
            e.clientY - rect.top
        );

        ctx.strokeStyle = '#ffffff';

        ctx.lineWidth = currentPenSize;

        ctx.lineCap = 'round';

        ctx.lineJoin = 'round';

    }


    function draw(e) {

        if (
            !isDrawing ||
            !isDrawingMode
        ) return;

        e.preventDefault();

        const rect =
            canvas.getBoundingClientRect();

        ctx.lineTo(
            e.clientX - rect.left,
            e.clientY - rect.top
        );

        ctx.stroke();

    }


    function stopDrawing() {

        isDrawing = false;

    }


    /* =========================================================
       SOUND EFFECT
       ========================================================= */

    function playChimeSFX() {

        [523, 659, 783].forEach((f, i) => {

            const osc =
                audioCtx.createOscillator();

            const gain =
                audioCtx.createGain();

            osc.frequency.setValueAtTime(
                f,
                audioCtx.currentTime + (i * 0.1)
            );

            gain.gain.setValueAtTime(
                0.05,
                audioCtx.currentTime + (i * 0.1)
            );

            gain.gain.exponentialRampToValueAtTime(
                0.01,
                audioCtx.currentTime + 0.5
            );

            osc.connect(gain);

            gain.connect(
                audioCtx.destination
            );

            osc.start(
                audioCtx.currentTime + (i * 0.1)
            );

            osc.stop(
                audioCtx.currentTime + 0.6
            );

        });

    }


    /* =========================================================
       GAME MODE
       ========================================================= */

    function toggleMode() {

        const mode =
            document.getElementById(
                'gameMode'
            ).value;

        const isTeam =
            mode === 'team';

        document.body.classList.toggle(
            'single-mode',
            !isTeam
        );

        document
            .getElementById('section-t2')
            .classList.toggle(
                'hidden',
                !isTeam
            );

        document
            .getElementById('syncMode')
            .classList.toggle(
                'hidden',
                !isTeam
            );

        document
            .getElementById('score-t1')
            .classList.toggle(
                'hidden',
                !isTeam
            );

        document
            .getElementById('label-t1')
            .classList.toggle(
                'hidden',
                !isTeam
            );

        if (isTeam) {

            handleSyncChange();

        }

        renderWord('t1');

    }


    function handleSyncChange() {

        const sync =
            document.getElementById(
                'syncMode'
            ).value;

        if (
            sync === 'off' &&
            wordList.length > 0
        ) {

            state.t2.index =
                Math.floor(
                    Math.random() *
                    wordList.length
                );

        }

        renderWord('t2');

    }


    function changeScore(team, val) {

        state[team].score =
            Math.max(
                0,
                state[team].score + val
            );

        document.getElementById(
            `val-${team}`
        ).innerText =
            state[team].score;

    }


    /* =========================================================
       WORD REGISTRATION
       ========================================================= */

    function registerWords() {

        const val =
            document.getElementById(
                'wordInput'
            ).value;

        if (!val) return;

        wordList =
            val
                .split(',')
                .map(s => s.trim())
                .filter(s => s !== "");

        state.t1.index = 0;

        state.t2.index =
            wordList.length > 0
                ? Math.floor(
                    Math.random() *
                    wordList.length
                )
                : 0;

        saveToLocalStorage();

        renderWord('t1');

        if (
            document.getElementById(
                'gameMode'
            ).value === 'team'
        ) {

            renderWord('t2');

        }

        document.getElementById(
            'wordInput'
        ).value = "";

    }


    /* =========================================================
       CARD VISIBILITY
       ========================================================= */

    function toggleCardVisibility() {

        cardsAreHidden =
            !cardsAreHidden;

        const btn =
            document.getElementById(
                'btnToggleCards'
            );

        document
            .getElementById('board-t1')
            .classList.toggle(
                'cards-hidden',
                cardsAreHidden
            );

        document
            .getElementById('board-t2')
            .classList.toggle(
                'cards-hidden',
                cardsAreHidden
            );

        btn.innerText =
            cardsAreHidden
                ? "👁️ Show Cards"
                : "👁️ Hide Cards";

        btn.style.background =
            cardsAreHidden
                ? "#ff9800"
                : "#00bcd4";

    }


    /* =========================================================
       RENDER WORD
       ========================================================= */

    function renderWord(team) {

        const sync =
            document.getElementById(
                'syncMode'
            ).value;

        const mode =
            document.getElementById(
                'gameMode'
            ).value;

        let idx =
            (
                team === 't2' &&
                sync === 'on' &&
                mode === 'team'
            )
                ? state.t1.index
                : state[team].index;

        let word =
            wordList[idx];

        const board =
            document.getElementById(
                `board-${team}`
            );

        board.innerHTML = "";

        document
            .getElementById(`check-${team}`)
            .classList.add('hidden');

        if (!word) return;

        word.split('').forEach(char => {

            const card =
                document.createElement('div');

            card.className = 'card';

            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">?</div>
                    <div class="card-back">${char}</div>
                </div>
            `;

            card.addEventListener(
                'pointerdown',
                (e) => {

                    e.preventDefault();

                    card.classList.toggle(
                        'flipped'
                    );

                    const all =
                        board.querySelectorAll(
                            '.card'
                        );

                    const flipped =
                        Array
                            .from(all)
                            .every(c =>
                                c.classList.contains(
                                    'flipped'
                                )
                            );

                    document
                        .getElementById(
                            `check-${team}`
                        )
                        .classList.toggle(
                            'hidden',
                            !flipped
                        );

                }
            );

            board.appendChild(card);

        });

    }


    /* =========================================================
       NAVIGATION
       ========================================================= */

    function navWord(team, dir) {

        if (wordList.length === 0) return;

        const sync =
            document.getElementById(
                'syncMode'
            ).value;

        const mode =
            document.getElementById(
                'gameMode'
            ).value;

        if (
            mode === 'team' &&
            sync === 'on'
        ) {

            state.t1.index =
                (
                    state.t1.index +
                    dir +
                    wordList.length
                ) %
                wordList.length;

            renderWord('t1');

            renderWord('t2');

        } else {

            state[team].index =
                (
                    state[team].index +
                    dir +
                    wordList.length
                ) %
                wordList.length;

            renderWord(team);

        }

    }


    /* =========================================================
       CHECK WORD
       ========================================================= */

    function checkWord(team) {

        playChimeSFX();

        const board =
            document.getElementById(
                `board-${team}`
            );

        const sync =
            document.getElementById(
                'syncMode'
            ).value;

        const mode =
            document.getElementById(
                'gameMode'
            ).value;

        let idx =
            (
                team === 't2' &&
                sync === 'on' &&
                mode === 'team'
            )
                ? state.t1.index
                : state[team].index;

        board.innerHTML =
            `<div class="final-word">${wordList[idx]}</div>`;

        document
            .getElementById(`check-${team}`)
            .classList.add('hidden');

        for (let i = 0; i < 30; i++) {

            const s =
                document.createElement('div');

            s.className = 'star';

            const a =
                Math.random() *
                Math.PI *
                2;

            const v =
                100 +
                Math.random() *
                200;

            s.style.setProperty(
                '--tx',
                Math.cos(a) * v + 'px'
            );

            s.style.setProperty(
                '--ty',
                Math.sin(a) * v + 'px'
            );

            s.style.left = '50%';

            s.style.top = '50%';

            board.appendChild(s);

            setTimeout(
                () => s.remove(),
                1200
            );

        }

    }


    /* =========================================================
       EDIT WORD
       ========================================================= */

    function editCurrentWord() {

        if (wordList.length > 0) {

            document.getElementById(
                'wordInput'
            ).value =
                wordList.join(', ');

        }

    }


    /* =========================================================
       LOCAL STORAGE
       ========================================================= */

    function saveToLocalStorage() {

        try {

            localStorage.setItem(
                'phonicsWords',
                JSON.stringify(wordList)
            );

            localStorage.setItem(
                'phonicsPhotos',
                JSON.stringify(photoStore)
            );

            localStorage.setItem(
                'phonicsOverlays',
                JSON.stringify(
                    activeBoardOverlays
                )
            );

        } catch (e) {

            console.warn(
                "Storage quota exceeded. Save using the Save file button instead."
            );

        }

    }


    /* =========================================================
       EXPORT
       ========================================================= */

    function exportData() {

        const exportObj = {

            words: wordList,

            photos: photoStore,

            overlays: activeBoardOverlays

        };

        const data =
            "data:text/json;charset=utf-8," +
            encodeURIComponent(
                JSON.stringify(exportObj)
            );

        const dl =
            document.createElement('a');

        dl.href = data;

        dl.download =
            "phonics_lesson.json";

        dl.click();

    }


    /* =========================================================
       IMPORT
       ========================================================= */

    function importData(e) {

        const file =
            e.target.files[0];

        if (!file) return;

        const reader =
            new FileReader();

        reader.onload = (ev) => {

            try {

                const parsed =
                    JSON.parse(
                        ev.target.result
                    );

                if (Array.isArray(parsed)) {

                    wordList = parsed;

                    photoStore = [];

                    activeBoardOverlays = [];

                } else {

                    wordList =
                        parsed.words || [];

                    photoStore =
                        parsed.photos || [];

                    activeBoardOverlays =
                        parsed.overlays || [];

                }

                saveToLocalStorage();

                renderGallery();

                restoreBoardOverlays();

                state.t1.index = 0;

                renderWord('t1');

            } catch (err) {

                alert(
                    "Invalid lesson file."
                );

            }

        };

        reader.readAsText(file);

        e.target.value = "";

    }


    /* =========================================================
       RESET
       ========================================================= */

    function resetGame() {

        if (
            confirm(
                "Are you sure you want to clear all words and photos?"
            )
        ) {

            localStorage.clear();

            location.reload();

        }

    }


    /* =========================================================
       DRAWER CONTROLS
       ========================================================= */

    function toggleDrawer(id) {

        const drawer =
            document.getElementById(id);

        const isOpen =
            drawer.classList.contains(
                'open'
            );

        document
            .querySelectorAll('.side-drawer')
            .forEach(d =>
                d.classList.remove('open')
            );

        if (!isOpen) {

            drawer.classList.add('open');

        }

    }


    /* =========================================================
       USER IMAGE UPLOAD
       ========================================================= */

    function handleImageUpload(e) {

        const files =
            Array.from(
                e.target.files
            );

        let loaded = 0;

        if (files.length === 0) return;

        files.forEach(file => {

            const reader =
                new FileReader();

            reader.onload = (ev) => {

                photoStore.push(
                    ev.target.result
                );

                loaded++;

                if (
                    loaded === files.length
                ) {

                    saveToLocalStorage();

                    renderGallery();

                }

            };

            reader.readAsDataURL(file);

        });

        e.target.value = "";

    }


    /* =========================================================
       PICTURE BANK
       =========================================================
       
       IMPORTANT:
       Built-in preset pictures are displayed first.
       User-uploaded pictures are displayed after them.

       Built-in pictures:
       - Cannot be deleted.
       - Are not stored in localStorage.
       - Are loaded directly from the game folder.
       ========================================================= */

    function renderGallery() {

        const grid =
            document.getElementById(
                'gallery-grid'
            );

        grid.innerHTML = "";


        /* -----------------------------------------
           BUILT-IN PRESET PICTURES
           ----------------------------------------- */

        presetPhotos.forEach(
            (src) => {

                const container =
                    document.createElement(
                        'div'
                    );

                container.className =
                    'gallery-thumb-container';


                const img =
                    document.createElement(
                        'img'
                    );

                img.src = src;

                img.className =
                    'gallery-thumb';

                img.alt =
                    'Preset Picture';

                img.title =
                    'Click to add this picture to the board';

                img.onclick = () =>
                    createNewOverlay(
                        'photo',
                        src
                    );


                /* Preset label */

                const label =
                    document.createElement(
                        'div'
                    );

                label.className =
                    'preset-label';

                label.innerText =
                    'PRESET';


                container.appendChild(img);

                container.appendChild(label);

                grid.appendChild(container);

            }
        );


        /* -----------------------------------------
           USER-UPLOADED PICTURES
           ----------------------------------------- */

        photoStore.forEach(
            (src, idx) => {

                const container =
                    document.createElement(
                        'div'
                    );

                container.className =
                    'gallery-thumb-container';


                const img =
                    document.createElement(
                        'img'
                    );

                img.src = src;

                img.className =
                    'gallery-thumb';

                img.alt =
                    'Uploaded Picture';

                img.onclick = () =>
                    createNewOverlay(
                        'photo',
                        src
                    );


                const del =
                    document.createElement(
                        'button'
                    );

                del.className =
                    'thumb-delete-btn';

                del.innerText = '✕';

                del.title =
                    'Delete uploaded picture';

                del.onclick = (e) => {

                    e.stopPropagation();

                    photoStore.splice(
                        idx,
                        1
                    );

                    saveToLocalStorage();

                    renderGallery();

                };


                container.appendChild(img);

                container.appendChild(del);

                grid.appendChild(container);

            }
        );

    }


    /* =========================================================
       ALPHABET LOGIC
       ========================================================= */

    function setLetterCase(caseType) {

        currentLetterCase =
            caseType;

        renderAlphabet();

    }


    function renderAlphabet() {

        const grid =
            document.getElementById(
                'letter-grid'
            );

        grid.innerHTML = "";

        const start =
            currentLetterCase === 'upper'
                ? 65
                : 97;

        for (
            let i = 0;
            i < 26;
            i++
        ) {

            const char =
                String.fromCharCode(
                    start + i
                );

            const tile =
                document.createElement(
                    'div'
                );

            tile.className =
                'letter-tile';

            tile.innerText =
                char;

            tile.onclick = () =>
                createNewOverlay(
                    'letter',
                    char
                );

            grid.appendChild(tile);

        }

    }


    /* =========================================================
       CREATE NEW OVERLAY
       ========================================================= */

    function createNewOverlay(
        type,
        content
    ) {

        const overlayData = {

            id:
                'overlay-' +
                Date.now() +
                '-' +
                Math.random()
                    .toString(36)
                    .substr(2, 4),

            type: type,

            content: content,

            left: '35%',

            top: '25%',

            width: '160px',

            height: '160px',

            transform:
                'translate3d(0px, 0px, 0px)',

            x: 0,

            y: 0

        };

        activeBoardOverlays.push(
            overlayData
        );

        saveToLocalStorage();

        buildOverlayElement(
            overlayData
        );

        toggleDrawer(
            type === 'photo'
                ? 'img-drawer'
                : 'letter-drawer'
        );

    }


    /* =========================================================
       RESTORE OVERLAYS
       ========================================================= */

    function restoreBoardOverlays() {

        document
            .querySelectorAll(
                '.draggable-wrapper'
            )
            .forEach(
                el => el.remove()
            );

        activeBoardOverlays.forEach(
            overlayData => {

                buildOverlayElement(
                    overlayData
                );

            }
        );

    }


    /* =========================================================
       BUILD OVERLAY
       ========================================================= */

    function buildOverlayElement(
        overlayData
    ) {

        const wrapper =
            document.createElement(
                'div'
            );

        wrapper.className =
            'draggable-wrapper';

        wrapper.id =
            overlayData.id;

        wrapper.style.left =
            overlayData.left;

        wrapper.style.top =
            overlayData.top;

        wrapper.style.width =
            overlayData.width;

        wrapper.style.height =
            overlayData.height;

        wrapper.style.transform =
            overlayData.transform;


        let childElement;


        if (
            overlayData.type === 'photo'
        ) {

            childElement =
                document.createElement(
                    'img'
                );

            childElement.src =
                overlayData.content;

            childElement.alt =
                'Picture';

        } else {

            childElement =
                document.createElement(
                    'div'
                );

            childElement.className =
                'draggable-letter';

            childElement.innerText =
                overlayData.content;

        }


        /* Delete button */

        const delBtn =
            document.createElement(
                'button'
            );

        delBtn.className =
            'overlay-delete-btn';

        delBtn.innerText = '✕';

        delBtn.onclick = (e) => {

            e.stopPropagation();

            wrapper.remove();

            activeBoardOverlays =
                activeBoardOverlays.filter(
                    item =>
                        item.id !==
                        overlayData.id
                );

            saveToLocalStorage();

        };


        /* Resize handle */

        const resizeHandle =
            document.createElement(
                'div'
            );

        resizeHandle.className =
            'overlay-resize-handle';


        wrapper.appendChild(
            childElement
        );

        wrapper.appendChild(
            delBtn
        );

        wrapper.appendChild(
            resizeHandle
        );

        document
            .getElementById(
                'main-container'
            )
            .appendChild(
                wrapper
            );


        makeDraggableAndResizable(
            wrapper,
            resizeHandle,
            overlayData.type === 'letter'
                ? childElement
                : null,
            overlayData
        );

    }


    /* =========================================================
       DRAG + RESIZE ENGINE
       ========================================================= */

    function makeDraggableAndResizable(
        element,
        resizeHandle,
        targetTextElement = null,
        overlayData = null
    ) {

        let activeDrag = false;

        let activeResize = false;

        let currentX =
            overlayData
                ? (overlayData.x || 0)
                : 0;

        let currentY =
            overlayData
                ? (overlayData.y || 0)
                : 0;

        let initialX,
            initialY;

        let startWidth,
            startHeight,
            startMouseX,
            startMouseY;


        if (targetTextElement) {

            updateFontSize(
                element.offsetWidth,
                element.offsetHeight
            );

        }


        element.addEventListener(
            'pointerdown',
            dragStart
        );

        resizeHandle.addEventListener(
            'pointerdown',
            resizeStart
        );


        function updateFontSize(
            width,
            height
        ) {

            if (targetTextElement) {

                const minDim =
                    Math.min(
                        width,
                        height
                    );

                targetTextElement.style.fontSize =
                    Math.floor(
                        minDim * 0.7
                    ) + 'px';

            }

        }


        function dragStart(e) {

            if (
                e.target.classList.contains(
                    'overlay-delete-btn'
                ) ||
                e.target.classList.contains(
                    'overlay-resize-handle'
                )
            ) {
                return;
            }

            initialX =
                e.clientX -
                currentX;

            initialY =
                e.clientY -
                currentY;

            activeDrag = true;

            element.setPointerCapture(
                e.pointerId
            );

            element.addEventListener(
                'pointermove',
                drag
            );

            element.addEventListener(
                'pointerup',
                dragEnd
            );

        }


        function drag(e) {

            if (activeDrag) {

                e.preventDefault();

                currentX =
                    e.clientX -
                    initialX;

                currentY =
                    e.clientY -
                    initialY;

                element.style.transform =
                    `translate3d(
                        ${currentX}px,
                        ${currentY}px,
                        0
                    )`;

            }

        }


        function dragEnd(e) {

            activeDrag = false;

            element.releasePointerCapture(
                e.pointerId
            );

            element.removeEventListener(
                'pointermove',
                drag
            );

            element.removeEventListener(
                'pointerup',
                dragEnd
            );


            if (overlayData) {

                overlayData.x =
                    currentX;

                overlayData.y =
                    currentY;

                overlayData.transform =
                    element.style.transform;

                saveToLocalStorage();

            }

        }


        function resizeStart(e) {

            e.stopPropagation();

            e.preventDefault();

            activeResize = true;

            startWidth =
                element.offsetWidth;

            startHeight =
                element.offsetHeight;

            startMouseX =
                e.clientX;

            startMouseY =
                e.clientY;

            resizeHandle.setPointerCapture(
                e.pointerId
            );

            resizeHandle.addEventListener(
                'pointermove',
                resizing
            );

            resizeHandle.addEventListener(
                'pointerup',
                resizeEnd
            );

        }


        function resizing(e) {

            if (activeResize) {

                e.preventDefault();

                const newWidth =
                    Math.max(
                        60,
                        startWidth +
                        (
                            e.clientX -
                            startMouseX
                        )
                    );

                const newHeight =
                    Math.max(
                        60,
                        startHeight +
                        (
                            e.clientY -
                            startMouseY
                        )
                    );

                element.style.width =
                    newWidth + 'px';

                element.style.height =
                    newHeight + 'px';

                updateFontSize(
                    newWidth,
                    newHeight
                );

            }

        }


        function resizeEnd(e) {

            activeResize = false;

            resizeHandle.releasePointerCapture(
                e.pointerId
            );

            resizeHandle.removeEventListener(
                'pointermove',
                resizing
            );

            resizeHandle.removeEventListener(
                'pointerup',
                resizeEnd
            );


            if (overlayData) {

                overlayData.width =
                    element.style.width;

                overlayData.height =
                    element.style.height;

                saveToLocalStorage();

            }

        }

    }


    /* =========================================================
       PAGE LOAD
       ========================================================= */

    window.onload = () => {

        initCanvas();


        /* Load saved words */

        const savedWords =
            localStorage.getItem(
                'phonicsWords'
            );

        if (savedWords) {

            try {

                wordList =
                    JSON.parse(
                        savedWords
                    );

                renderWord('t1');

            } catch (e) {

                console.warn(
                    "Could not load saved words."
                );

            }

        }


        /* Load uploaded pictures */

        const savedPhotos =
            localStorage.getItem(
                'phonicsPhotos'
            );

        if (savedPhotos) {

            try {

                photoStore =
                    JSON.parse(
                        savedPhotos
                    );

            } catch (e) {

                photoStore = [];

            }

        }


        /*
         * ALWAYS render the gallery.
         *
         * This ensures slide.png appears
         * even when there are no uploaded
         * pictures.
         */

        renderGallery();


        /* Load saved overlays */

        const savedOverlays =
            localStorage.getItem(
                'phonicsOverlays'
            );

        if (savedOverlays) {

            try {

                activeBoardOverlays =
                    JSON.parse(
                        savedOverlays
                    );

                restoreBoardOverlays();

            } catch (e) {

                activeBoardOverlays = [];

            }

        }


        /* Render alphabet */

        renderAlphabet();

    };

const preset=()=>data.presets.find(p=>p.id===data.selected)||data.presets[0];
const words=()=>preset().words;
// Built-in and custom presets may use different PNG subfolders.
// Set a folder in Presets & Photos; changes are stored with the preset.
const slug=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const photoFolder=p=>String(p.photoFolder||((p.id||'').startsWith('built-')?p.id.slice(6):'custom-'+slug(p.name))).replace(/^photos\/?/i,'').replace(/^\/+|\/+$/g,'');
const photoFile=(w,p=preset())=>{const name=String(w.text||'').trim();const folder=photoFolder(p).toLowerCase();return (folder==='alphabet-uppercase'||folder==='alphabet-mixed'?name:name.toLowerCase())+'.webp'};
const autoPhoto=(w,p=preset())=>'photos/'+encodeURIComponent(photoFolder(p))+'/'+encodeURIComponent(photoFile(w,p));
const photoCandidates=(w,p=preset())=>{
  const name=photoFile(w,p), folder=photoFolder(p), candidates=[];
  if(w.image)candidates.push(w.image);
  candidates.push('photos/'+encodeURIComponent(folder)+'/'+encodeURIComponent(name));
  // Fallback for older collections that store PNGs directly in photos/.
  candidates.push('photos/'+encodeURIComponent(name));
  return [...new Set(candidates)];
};
const photoMarkup=(w,p=preset(),preview=false)=>{
 const candidates=photoCandidates(w,p);
 // Store alternative paths on the image element. If the first file is absent,
 // try the next path without losing the rest of the game interface.
 const encoded=esc(JSON.stringify(candidates));
 return `<img src="${esc(candidates[0])}" data-photo-paths="${encoded}" data-photo-index="0" alt="${esc(w.text)}" ${preview?'class="premium-editor-preview"':''} onerror="Premium.photoFallback(this)"><span class="premium-photo-missing" style="display:none">No picture found: ${esc(photoFile(w,p))}</span>`;
};
function photoFallback(img){
 let paths=[];try{paths=JSON.parse(img.getAttribute('data-photo-paths')||'[]')}catch(e){}
 const next=Number(img.dataset.photoIndex||0)+1;
 if(next<paths.length){img.dataset.photoIndex=String(next);img.src=paths[next];return}
 img.style.display='none';const label=img.nextElementSibling;
 if(label&&label.classList.contains('premium-photo-missing'))label.style.display='block';
}
function setPhotoFolder(value){
 const p=preset();let v=String(value||'').trim().replace(/\\/g,'/').replace(/^photos\/?/i,'').replace(/^\/+|\/+$/g,'');
 if(!v||v.includes('..')||v.includes('/')){alert('Enter only the folder name inside photos, for example phonics-ig-it.');editor();return}
 p.photoFolder=v;save();editor();
}

const pick=(n)=>{const a=[...words()];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return Array.from({length:n},(_,i)=>a[i%a.length]||{id:id(),text:'?',image:null}).map(x=>({...x}));};

function normalizePremiumPresets(x){
 if(!x||!Array.isArray(x.presets))return x;
 const removed={'Phonics -ad / -at':['bathtub','sats','thermostat'],'Phonics short e / e_e':['feet','green','seed'],'Phonics short u / u_e':['flute','prune','rule','June','rude','Luke'],'Phonics er / ir / ur':['jerk']};
 for(const p of x.presets){
  if(!p.builtin)continue;
  const oldName=p.name;
  const m=/^Super Star ([1-4])$/.exec(oldName);
  if(m){
   const oldId='built-super-star-'+m[1],newId='built-super-starter-'+m[1];
   p.name='Super Starter '+m[1];
   if(p.id===oldId){p.id=newId;if(x.selected===oldId)x.selected=newId;}
   // A previously configured folder remains user-controlled; default uses new folder name.
  }
  const excluded=new Set((removed[p.name]||[]).map(w=>w.toLowerCase()));
  if(excluded.size&&Array.isArray(p.words))p.words=p.words.filter(w=>!excluded.has(String(w.text||'').toLowerCase()));
 }
 return x;
}
function load(){try{let x=normalizePremiumPresets(JSON.parse(localStorage.getItem('teacher-khen-premium-v2')));if(x&&Array.isArray(x.presets)&&x.presets.length){data={...data,...x,game:null};for(const p of data.presets){if(!p.builtin)continue;const original=defaults.find(d=>d.id===p.id);if(!original)continue;const v22List=previousV22PhonicsWords[p.name];if(v22List&&p.words.length===v22List.length&&p.words.every((w,i)=>String(w.text).toLowerCase()===v22List[i].toLowerCase())){const previousPictures=new Map(p.words.filter(w=>w.image).map(w=>[w.text.toLowerCase(),w.image]));p.words=original.words.map(w=>({...w,image:previousPictures.get(w.text.toLowerCase())||null}));continue;}const oldList=previousPhonicsWords[p.name];if(oldList&&p.words.length===oldList.length&&p.words.every((w,i)=>String(w.text).toLowerCase()===oldList[i].toLowerCase())){const previousPictures=new Map(p.words.filter(w=>w.image).map(w=>[w.text.toLowerCase(),w.image]));p.words=original.words.map(w=>({...w,image:previousPictures.get(w.text.toLowerCase())||null}));continue;}const existing=new Map(p.words.map(w=>[String(w.text).toLowerCase(),w]));const originalKeys=new Set(original.words.map(w=>w.text.toLowerCase()));p.words=[...original.words.map(w=>existing.get(w.text.toLowerCase())||{...w}),...p.words.filter(w=>!originalKeys.has(String(w.text).toLowerCase()))];}}}catch(e){console.warn(e)}}
function exportJSON(){const blob=new Blob([JSON.stringify({...data,game:null,legacy:{words:wordList,photos:photoStore,overlays:activeBoardOverlays,mode:document.getElementById('gameMode').value,sync:document.getElementById('syncMode').value}},null,2)],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='teacher-khen-phonics-premium.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function importJSON(e){let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>120*1024*1024)throw Error('File exceeds 120 MB.');let x=normalizePremiumPresets(JSON.parse(await f.text()));if(!Array.isArray(x.presets)||!x.presets.length)throw Error('This is not a Premium preset file.');for(const p of x.presets){if(typeof p.id!=='string'||typeof p.name!=='string'||!Array.isArray(p.words))throw Error('Invalid preset structure.');for(const w of p.words){if(typeof w.text!=='string'||(w.image!=null&&!/^data:image\/(png|jpeg|gif|webp);base64,/i.test(w.image)))throw Error('Invalid word or image.')}}if(!confirm('Replace current Premium presets with this imported file?'))return;data={version:2,presets:x.presets,selected:x.presets.some(p=>p.id===x.selected)?x.selected:x.presets[0].id,settings:{...data.settings,...x.settings},game:null};if(x.legacy){wordList=Array.isArray(x.legacy.words)?x.legacy.words:[];photoStore=Array.isArray(x.legacy.photos)?x.legacy.photos:[];activeBoardOverlays=Array.isArray(x.legacy.overlays)?x.legacy.overlays:[];document.getElementById('gameMode').value=x.legacy.mode==='team'?'team':'single';document.getElementById('syncMode').value=x.legacy.sync==='off'?'off':'on';state.t1.index=0;state.t2.index=0;toggleMode();renderGallery();restoreBoardOverlays();saveToLocalStorage()}save();refreshFlipPresets();open('presets');notify('Imported words and embedded pictures.')}catch(err){alert('Import failed; existing data unchanged. '+err.message)}}

n')">🖼️ Present</button><button onclick="Premium.open('setup')">🎮 Game Setup</button></div>`)}

function fitPresentationWord(){

window.TKPhonicsPremiumCommunityLoad = function(incoming) {

      incoming.presets.length > 100) {

  }

        typeof p.name !== 'string' || !p.name.trim() ||
        !Array.isArray(p.words) || !p.words.length || p.words.length > 1000) {

    }

          typeof w.text !== 'string' || !w.text.trim() ||
          (w.image != null && (typeof w.image !== 'string' ||
          !/^data:image\/(png|jpeg|gif|webp);base64,/i.test(w.image)))) {
        throw new Error('Invalid word or picture in preset ' + (i + 1));
      }
      return {...w, id: String(w.id || 'community-word-' + j),
        text: w.text, image: w.image || null};
    });
    return {...p, id: String(p.id || 'community-preset-' + i),
      name: p.name, builtin: false, words};
  });

    ? incoming.selected : presets[0].id;
  const safeSettings = incoming.settings && typeof incoming.settings === 'object' &&
    !Array.isArray(incoming.settings) ? incoming.settings : {};
  const mergedSettings = {...data.settings};
  if ([3,4,5,6].includes(Number(safeSettings.grid))) mergedSettings.grid = Number(safeSettings.grid);
  if ([1,2,3,4].includes(Number(safeSettings.lines))) mergedSettings.lines = Number(safeSettings.lines);
  if (Number.isInteger(Number(safeSettings.steps)) && Number(safeSettings.steps) >= 1 && Number(safeSettings.steps) <= 10) mergedSettings.steps = Number(safeSettings.steps);
  if (Array.isArray(safeSettings.directions) && safeSettings.directions.length &&
      safeSettings.directions.every(d => ['h','v','d'].includes(d))) mergedSettings.directions = [...new Set(safeSettings.directions)];
  // Preserve previously saved device presets: only change in-memory data.
  // Do not call save() or the original importJSON() here.
  data = {...data, version: 2, presets, selected, settings: mergedSettings, game: null};
  if (incoming.legacy && typeof incoming.legacy === 'object' && !Array.isArray(incoming.legacy)) {
    const old = incoming.legacy;
    if (Array.isArray(old.words)) wordList = old.words.filter(w => typeof w === 'string');

      left:o.left||'35%', top:o.top||'25%', width:o.width||'160px',
      height:o.height||'160px',transform:o.transform||'translate3d(0px, 0px, 0px)',

const ConnectDots=(()=>{

 const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
 function leave(){clearInterval(clock);clearInterval(rollTimer);clock=null;rollTimer=null;rolling=false;if(state)state.running=false;}
 function setup(){leave();let p=settings();Premium.dotsShell('🎲 Connect the Dots',`<p class="cd-notice">Roll the dice • Read a word • Connect dots • Win points!</p><div class="cd-setup"><button class="cd-style" onclick="ConnectDots.start(1)">🔵🔴 <strong>Classic Connect</strong><br><small>Connect 3 or 4 words to score</small></button><button class="cd-style" onclick="ConnectDots.start(2)">🏆 <strong>Trophy Race</strong><br><small>Share squares and reach the trophy</small></button></div><div class="cd-setup"><label>⏱ Game time <select id="cd-duration">${[1,2,3,5,8,10,15].map(n=>`<option value="${n}" ${p.duration===n*60?'selected':''}>${n} minute${n>1?'s':''}</option>`).join('')}</select></label><button onclick="Premium.open('presets')">📚 Edit Word Presets</button><button onclick="Premium.open('menu')">← Games</button></div><p class="cd-notice">Classic: 3 in a line = 1 point; 4 in a line = 2 points. Trophy Race: both teams may claim the same word; move left to right to reach a trophy. Use the same phonics word group selected in Presets.</p>`)}
 function start(style){leave();const words=Premium.getDotWords();if(!words.length){alert('Add words to a preset first.');return}const duration=Number($('cd-duration')?.value||1)*60;const pool=[...words];for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}state={style,duration,left:duration,words:Array.from({length:36},(_,i)=>pool[i%pool.length]),claims:Array(36).fill(0),trophies:Array(6).fill(0),team:1,turns:0,rolled:0,score:[0,0],finished:false,running:false};persist();render()}
 function points(team){let total=0;const dirs=[[0,1],[1,0],[1,1],[1,-1]];for(let r=0;r<6;r++)for(let c=0;c<6;c++)for(const [dr,dc] of dirs){let pr=r-dr,pc=c-dc;if(pr>=0&&pr<6&&pc>=0&&pc<6)continue;let count=0,rr=r,cc=c;while(rr>=0&&rr<6&&cc>=0&&cc<6){if(state.claims[rr*6+cc]===team)count++;else{total+=Math.max(0,count-2);count=0}rr+=dr;cc+=dc}total+=Math.max(0,count-2)}return total}
 function canClaim(row,col){if(state.finished||state.rolled!==row+1)return false;const idx=row*6+col;if(state.style===1)return !state.claims[idx];const bit=state.team===1?1:2;if(state.claims[idx]&bit)return false;if(col===0)return true;return !!(state.claims[row*6+col-1]&bit)}
 function claim(row,col){if(!canClaim(row,col)){notify('Roll the die and select an available word in that row. In Trophy Race, advance from left to right.');return}audio();let idx=row*6+col;if(state.style===1){state.claims[idx]=state.team;state.score=[points(1),points(2)]}else state.claims[idx]|=state.team;endTurn();}
 function trophy(row){if(!state||state.style!==2||state.finished||state.rolled!==row+1)return;const bit=state.team;if(state.trophies[row]||!(state.claims[row*6+5]&bit)){notify('Finish the six word squares in this row first.');return}audio();state.trophies[row]=bit;state.score[bit-1]++;endTurn();if(state.trophies.every(Boolean))finish()}
 function endTurn(){state.turns++;state.team=state.team===1?2:1;state.rolled=0;render()}
